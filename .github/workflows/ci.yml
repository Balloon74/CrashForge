name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux checks and ASan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential

      - name: Run checks
        run: make check

      - name: Build ASan examples
        run: make examples-asan

      - name: Run ASan end-to-end tests
        run: cargo test --test asan_tests -- --nocapture
