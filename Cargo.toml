[package]
name = "crashforge"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Turn software crashes into permanent, minimal, reproducible regression tests."
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "crashforge"
path = "src/main.rs"
